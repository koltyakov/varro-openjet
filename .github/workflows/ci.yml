name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: webview/package.json
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Use pinned npm version
        run: npm install --global "npm@$(node -p 'require("./webview/package.json").volta.npm')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test and build plugin archive
        shell: bash
        run: |
          args=()
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            args+=("-PpluginVersion=$RELEASE_VERSION")
          fi
          ./gradlew --no-daemon --stacktrace check buildPlugin "${args[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-archive
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested plugin archive
        uses: actions/download-artifact@v4
        with:
          name: plugin-archive
          path: dist

      - name: Publish release and attach plugin archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Varro OpenJet ${{ github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
