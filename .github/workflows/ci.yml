name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install pinned Python linter
        run: python3 -m pip install --disable-pip-version-check ruff==0.17.1

      - name: Lint release helpers and check shell syntax
        run: |
          python3 -m ruff check --select E4,E7,E9,F,I,EXE,SIM,PLW scripts/{check-opencode-compatibility,test-opencode-compatibility,release-artifact,test-release-artifact}.py
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Test build and release scripts
        run: |
          for test in scripts/test-*.py; do
            python3 "$test"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: webview/package.json
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Use pinned npm version
        run: npm install --global "npm@$(node -p 'require("./webview/package.json").volta.npm')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check, test released OpenCode and build once
        shell: bash
        run: |
          version=$(node -p 'require("./webview/vendor/UPSTREAM.json").opencodeDependencies.client.replace(/^\^/, "")')
          python3 scripts/check-opencode-compatibility.py --version "$version" --full-check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-compatibility-${{ github.run_attempt }}
          path: build/opencode-compatibility/*/verification.json
          retention-days: 14

      - name: Upload tested plugin archive
        uses: actions/upload-artifact@v7
        with:
          # Attempts are immutable and cannot accidentally reuse an earlier rerun's ZIP.
          name: plugin-archive-${{ github.run_attempt }}
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
