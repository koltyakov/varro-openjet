name: CI and release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Test Docker build cleanup
        run: python3 scripts/test-build.py

      - name: Test native bridge benchmark gate
        run: python3 scripts/test-host-benchmark.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: webview/package.json
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Use pinned npm version
        run: npm install --global "npm@$(node -p 'require("./webview/package.json").volta.npm')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test and build plugin archive
        shell: bash
        run: |
          args=()
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            args+=("-PpluginVersion=$RELEASE_VERSION")
          fi
          ./gradlew --no-daemon --stacktrace check buildPlugin "${args[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: plugin-archive
          path: build/distributions/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compatibility:
    name: Released OpenCode compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version-file: webview/package.json
      - name: Use pinned npm version
        run: npm install --global "npm@$(node -p 'require("./webview/package.json").volta.npm')"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify the pinned published V2 release in isolated fixtures
        shell: bash
        run: |
          version=$(node -p 'require("./webview/vendor/UPSTREAM.json").opencodeDependencies.client.replace(/^\^/, "")')
          python3 scripts/check-opencode-compatibility.py --version "$version"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-compatibility
          path: |
            build/opencode-compatibility/*/verification.json
            build/test-results/
            build/reports/tests/
          retention-days: 14

  verify:
    name: Verify IDE ${{ matrix.ide }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ide: ['2025.2.6.3', '2025.3.6.1', '2026.1.5', '2026.2.3', '263.6800.24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version-file: webview/package.json
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: Use pinned npm version
        run: npm install --global "npm@$(node -p 'require("./webview/package.json").volta.npm')"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify plugin on the host runner
        run: ./gradlew --no-daemon verifyPlugin -PverificationIde=${{ matrix.ide }}
      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-${{ matrix.ide }}
          path: build/reports/pluginVerifier/
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, compatibility, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested plugin archive
        uses: actions/download-artifact@v8
        with:
          name: plugin-archive
          path: dist

      - name: Publish release and attach plugin archive
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Varro OpenJet ${{ github.ref_name }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  marketplace:
    name: Upload stable release to JetBrains Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: [build, compatibility, verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download tested plugin archive
        uses: actions/download-artifact@v8
        with:
          name: plugin-archive
          path: dist

      - name: Upload tested archive to the stable channel
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: bash scripts/publish-marketplace.sh
