kotlin.code.style=official

# Plugin coordinates
pluginGroup=varro
pluginName=Varro: OpenJet
pluginVersion=0.1.1

# Plugin compatibility range. Verify each supported release branch before publishing.
pluginSinceBuild=252
pluginUntilBuild=262.*

# Target platform for compilation and the `runIde` sandbox, pinned to an exact
# build. JCEF became a separate platform module in 2026.2 (262). Use its resource
# handler adapter and capability checks for APIs that differ on older runtimes.
# IntelliJ IDEA Community's last release was 2025.3; 2026.x ships as the unified
# Ultimate distribution, so that is what a 262-targeting build compiles against.
# Only compilation uses it - the plugin itself runs on any 252-262 IDE.
platformType=IU
platformVersion=2026.2.2

# Bundled plugins the host integrates with. Git4Idea backs commit-message
# generation; the terminal plugin backs `terminal/run` and terminal selection.
# JCEF became a bundled plugin in 2026.2 rather than part of the platform, so it
# has to be requested explicitly to compile against org.cef and com.intellij.ui.jcef.
platformBundledPlugins=Git4Idea,org.jetbrains.plugins.terminal,com.intellij.modules.jcef

# Bundled platform modules that are not pulled in transitively. None are needed
# today; the commit action shells out to git rather than using Git4Idea's API.
platformBundledModules=

# Set to true to skip the npm webview build (useful for Kotlin-only iteration).
skipWebview=false

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=false
org.jetbrains.intellij.buildFeature.selfUpdateCheck=false
